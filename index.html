.caseInner{position:relative;z-index:1;width:min(940px,100%);margin:0 auto}

.folderBack{position:absolute;inset:22px 20px 0 6px;border:1px solid rgba(173,146,122,.22);background:linear-gradient(180deg,#eadac8,#e2d0bd);box-shadow:0 24px 60px rgba(67,43,35,.10);transform:rotate(-.6deg);pointer-events:none}
.folderBack::before{content:"";position:absolute;top:-24px;left:22px;width:170px;height:30px;border:1px solid rgba(173,146,122,.22);border-bottom:0;background:#e8d7c4;border-radius:4px 4px 0 0}
.folderBack::after{content:"DOSSIER · P";position:absolute;left:28px;bottom:18px;color:rgba(111,38,55,.25);font:9px "Avenir Next","Helvetica Neue",Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase}
.tabs{position:absolute;right:0;top:55px;z-index:6;display:grid;gap:8px}.tab{width:52px;height:54px;border:1px solid #cdb9a6;border-left:0;background:#eadcca;color:#8d7969;display:grid;place-items:center;transform:translateX(9px);transition:.35s cubic-bezier(.2,.8,.2,1);box-shadow:4px 8px 18px rgba(64,43,36,.05)}.tab.done{background:var(--wine);color:#fff;border-color:var(--wine)}.tab.current{transform:translateX(1px);background:#f8f1e8;color:var(--wine);box-shadow:4px 10px 24px rgba(64,43,36,.10)}.tabNum{font-size:8px;letter-spacing:.16em}

.page{position:relative;z-index:3;background:rgba(255,255,255,.46);border:1px solid #d6c6b6;box-shadow:var(--shadow);padding:27px 28px 25px;overflow:hidden;transform-origin:center center}.page::before{content:"";position:absolute;inset:12px;border:1px solid rgba(179,139,96,.22);pointer-events:none}.page.entry-0{animation:entry0 .72s ease both}.page.entry-1{animation:entry1 .78s cubic-bezier(.2,.8,.2,1) both}.page.entry-2{animation:entry2 .82s cubic-bezier(.2,.75,.2,1) both}.page.entry-3{animation:entry3 .9s cubic-bezier(.2,.8,.2,1) both}.page.entry-4{animation:entry4 .86s cubic-bezier(.2,.75,.2,1) both}

/* FULL SCREEN TRANSITIONS */
.transition{position:fixed;inset:0;z-index:650;display:none;overflow:hidden}
.transition.show{display:block}
.transition button{min-height:50px}

/* 2 - archive drawer */

.t1 .drawerLabel{position:absolute;left:50%;top:14%;transform:translateX(-50%);font:9px "Avenir Next","Helvetica Neue",Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#d8bca2;opacity:0;animation:fadeUp .45s .5s ease forwards}
.t1 .fileCard{position:absolute;left:50%;top:50%;width:min(680px,84vw);transform:translate(-50%,30%);background:#f6eee3;color:var(--ink);border:1px solid #cdbba7;box-shadow:0 28px 80px rgba(0,0,0,.28);padding:36px;text-align:center;opacity:0;animation:fileLift .72s .45s cubic-bezier(.2,.85,.2,1) forwards}

.t1.closing .fileCard{animation:fileDrop .55s ease forwards}.t1.closing .drawerWall{animation:drawerFall .7s .2s ease forwards}

/* keyframes */

@keyframes breathe{50%{box-shadow:inset 0 0 0 7px rgba(255,255,255,.03),0 0 0 8px rgba(255,255,255,.012)}}
@keyframes draw{to{width:230px}}

@keyframes openingFade{0%,78%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes curtainL{to{transform:translateX(-110%)}} @keyframes curtainR{to{transform:translateX(110%)}}
@keyframes entry0{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes entry1{from{opacity:0;transform:translateX(60px) rotate(.8deg)}to{opacity:1;transform:none}}
@keyframes entry2{from{opacity:0;transform:translateY(55px) scale(.98)}to{opacity:1;transform:none}}
@keyframes entry3{from{opacity:0;clip-path:inset(0 50% 0 50%)}to{opacity:1;clip-path:inset(0)}}

@keyframes t0paper{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes stampSlam{0%{opacity:0;transform:rotate(-7deg) scale(2.2)}70%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-7deg) scale(1)}}
@keyframes t0close{to{transform:rotateY(-82deg) translateX(-25%);opacity:0}}

@keyframes fileLift{to{transform:translate(-50%,-50%);opacity:1}} @keyframes fileDrop{to{transform:translate(-50%,20%);opacity:0}}
@keyframes coverLIn{to{transform:translateX(0)}} @keyframes coverRIn{to{transform:translateX(0)}} @keyframes coverLOut{to{transform:translateX(-100%)}} @keyframes coverROut{to{transform:translateX(100%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}} @keyframes fadeOutSimple{to{opacity:0}}
@keyframes typeLine{to{transform:scaleX(1)}} @keyframes blink{50%{opacity:0}} @keyframes peel{to{transform:rotateX(75deg) translateY(40px);transform-origin:bottom;opacity:0}}
@keyframes coverSettle{to{transform:rotateX(0) scale(1);opacity:1}} @keyframes coverOpen{to{transform:rotateY(-85deg) translateX(-28%);transform-origin:left;opacity:0}}
@keyframes archiveIn{to{transform:translateX(0)}}
@keyframes menuRise{from{opacity:0;transform:translateY(20px) scale(.99)}to{opacity:1;transform:none}}

@media(max-width:780px){
  .case{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .caseHead{display:block}.caseActions{margin-top:12px}.archiveBtn{margin-top:0}.resetBtn{display:none!important}.dossier{padding-right:0}.folderBack{display:none}.tabs{position:relative;right:auto;top:auto;display:flex;gap:7px;margin:0 0 10px;justify-content:space-between}.tab{width:auto;flex:1;height:36px;border-left:1px solid #cdb9a6;transform:none}.tab.current{transform:translateY(-3px)}
  .paperStack{min-height:0}.paperBack1,.paperBack2{display:none}.page{padding:24px 18px 20px}.title{font-size:48px}.lead{font-size:16px}.clue{padding:20px 16px}.clue p{font-size:17px}.answer{display:block}.answer input,.answer button{width:100%}.answer button{height:48px;margin-top:10px}.t0 .stampPaper{inset:5vh 5vw}.t1 .fileCard{padding:28px 20px}.t2 .centerCard{padding:22px}.t3{padding:4vh 4vw}.t3 .typeSheet{padding:38px 24px;min-height:76vh}.t4 .dossierCover{width:90vw;height:68vh;padding:30px 22px}.menu{padding:40px 20px 28px}.course h3{font-size:24px}.otp{width:54px;height:64px;font-size:28px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

<body>
<div id="opening" class="opening" aria-hidden="true"><div class="openingInner"><div class="openingMark">P</div><div class="openingText">Referencia confirmada</div></div></div>
<section id="intro" class="screen intro active">
  <div class="introCard">
    <div class="monogram">P</div>
    <div class="overline">Archivo privado · 02.10.26</div>
    <h1 class="hero"><span class="script">Expediente</span>Pituflillos</h1>
    <div class="heroRule"></div>
    <p class="heroSub">Hay fechas que no necesitan explicación. Solo recordar dónde empezó todo.</p>
    <div class="micro otpLabel">Clave de acceso · día + mes</div>
    <div id="otpWrap" class="otpWrap">
      <input class="otp" inputmode="numeric" maxlength="1" aria-label="Dígito 1"><input class="otp" inputmode="numeric" maxlength="1" aria-label="Dígito 2"><input class="otp" inputmode="numeric" maxlength="1" aria-label="Dígito 3"><input class="otp" inputmode="numeric" maxlength="1" aria-label="Dígito 4">
    </div>
    <button id="openBtn" class="openBtn" type="button">Abrir expediente</button>
    <div id="feedback" class="feedback" aria-live="polite"></div>
  </div>
</section>
<section id="case" class="screen case">
  <div class="caseInner">
    <div class="caseHead">
      <div><h1 class="caseBrand"><span class="script">Expediente</span>Pituflillos</h1><div class="caseMeta">02.10.26 · acceso reservado</div></div>
      <div class="caseActions"><button id="resetBtn" class="resetBtn" type="button">Reiniciar expediente</button><button id="archiveBtn" class="archiveBtn" type="button">Archivo de notas</button></div>
    </div>
    <div id="dossier" class="dossier">
      <div class="folderBack"></div>
      <div id="tabs" class="tabs"></div>
      <div id="paperStack" class="paperStack"><div class="paperBack1"></div><div class="paperBack2"></div><div id="pageHost"></div><div id="menuHost"></div></div>
    </div>
  </div>
</section>
<div id="transition" class="transition" aria-hidden="true"></div>
<div id="drawer" class="drawer" aria-hidden="true"><div class="drawerPanel"><div class="drawerHead"><div class="archiveTitle">Archivo de notas recuperadas</div><button id="closeDrawer" class="closeX" type="button">×</button></div><div id="notesList"></div></div></div>
<script>
(function(){
'use strict';
const ACCESS='0212';
const DATA=[
 {title:'El primer indicio',lead:'La noche empieza con algo pequeño, elegante y pensado para abrir la mesa.',clue:'La primera nota menciona mantequilla batida, miel y ajo asado. Falta una hierba aromática muy habitual con pan y carne.',question:'¿Qué hierba aromática completa la primera nota?',answers:['romero'],hint:'Es mediterránea, de hoja fina y aroma muy reconocible.',fragment:'Romero · miel · una primera impresión.'},
 {title:'El contraste',lead:'La segunda ficha habla de un equilibrio entre cremosidad, fruta y un toque tostado.',clue:'Hay burrata, hay uvas asadas… y falta un fruto seco pequeño y verde que da textura al conjunto.',question:'¿Qué fruto seco completa la composición?',answers:['pistacho','pistachos'],hint:'Verde, pequeño y mucho más elegante aquí que en un helado.',fragment:'Uvas · pistacho · un contraste inesperado.'},
 {title:'La pieza central',lead:'La tercera ficha deja de hablar de acompañamientos y señala directamente al centro de la mesa.',clue:'Una sola pieza reúne dos cortes separados por un hueso muy reconocible. Su forma da nombre al corte: parece una letra.',question:'¿Qué corte es?',answers:['t-bone','t bone','tbone','t-bone steak','t bone steak'],hint:'El hueso del centro tiene forma de T.',fragment:'T-bone · una pieza · para compartir.'},
 {title:'El desenlace',lead:'Toda buena cena reserva un final reconocible y sencillo de imaginar.',clue:'La ficha solo deja dos palabras muy claras: vainilla a un lado y, como protagonista, el sabor principal del postre.',question:'¿Qué ingrediente protagoniza el desenlace?',answers:['chocolate'],hint:'Es el sabor principal del coulant.',fragment:'Chocolate · vainilla · el desenlace.'},
 {title:'El epílogo',lead:'La última nota ya no pertenece exactamente al plato, pero sí por completo a la noche.',clue:'Octubre, chimenea y una tradición sencilla de otoño. Solo falta nombrar el fruto que la completa.',question:'¿Qué fruto cierra el expediente?',answers:['castaña','castañas'],hint:'Se le hace un corte antes de asarlo.',fragment:'Octubre · chimenea · una última tradición.'}
];
const MENU=[
 ['El primer indicio','Pan de cristal','Mantequilla batida · ajo asado · romero · miel · sal en escamas'],
 ['La pista falsa','Burrata','Uvas asadas · pistacho · balsámico'],
 ['La prueba definitiva','T-bone para compartir','Patatas baby crujientes · cebollitas glaseadas al balsámico'],
 ['El desenlace','Coulant de chocolate','Vainilla · sal en escamas'],
 ['Epílogo','Castañas junto al fuego','Una última tradición para cerrar la noche.']
];
let state={index:0,solved:[],notes:[]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const intro=$('#intro'),caseScreen=$('#case'),opening=$('#opening'),feedback=$('#feedback'),pageHost=$('#pageHost'),menuHost=$('#menuHost'),tabs=$('#tabs'),transition=$('#transition'),drawer=$('#drawer'),notesList=$('#notesList'),archiveBtn=$('#archiveBtn'),resetBtn=$('#resetBtn'),closeDrawer=$('#closeDrawer'),paperStack=$('#paperStack');
const otpWrap=$('#otpWrap'),otp=$$('.otp');
function save(){localStorage.setItem('pituflillos_dossier_v1',JSON.stringify(state));}
function load(){try{const r=localStorage.getItem('pituflillos_dossier_v1');if(r){const p=JSON.parse(r);if(p&&typeof p.index==='number')state=p;}}catch(e){}}
function norm(t){return (t||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function code(){return otp.map(x=>x.value).join('');}
otp.forEach((input,i)=>{
 input.addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'');if(v.length>1){const chars=v.slice(0,4).split('');otp.forEach((b,j)=>b.value=chars[j]||'');otp[Math.min(chars.length,3)].focus();}else{e.target.value=v;if(v&&i<3)otp[i+1].focus();}if(code().length===4){otpWrap.classList.add('ok');setTimeout(()=>otpWrap.classList.remove('ok'),350);}});
 input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!e.target.value&&i>0)otp[i-1].focus();if(e.key==='Enter'){e.preventDefault();openCase();}});
 input.addEventListener('paste',e=>{e.preventDefault();const chars=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,4).split('');otp.forEach((b,j)=>b.value=chars[j]||'');otp[Math.min(Math.max(chars.length-1,0),3)].focus();});
});
function openCase(){if(code()!==ACCESS){feedback.textContent='La referencia no coincide. Prueba con el día y el mes.';return;}feedback.textContent='';opening.classList.add('show');setTimeout(()=>{intro.classList.remove('active');caseScreen.classList.add('active');render();},920)}
$('#openBtn').addEventListener('click',openCase);
function renderTabs(){tabs.innerHTML=DATA.map((d,i)=>`<div class="tab ${state.solved[i]?'done':''} ${i===state.index&&!state.solved[i]?'current':''}"><div class="tabNum">0${i+1}</div></div>`).join('')}
function renderNotes(){notesList.innerHTML=state.notes.length?state.notes.map((n,i)=>`<div class="noteCard"><div class="noteLabel">Nota 0${i+1}</div><div class="noteText">${n}</div></div>`).join(''):'<div class="noteCard"><div class="noteLabel">Archivo</div><div class="noteText">Todavía no hay notas recuperadas.</div></div>'}
function render(){renderTabs();renderNotes();if(state.index>=DATA.length)renderMenu();else renderChapter()}
function renderChapter(){
 menuHost.innerHTML='';paperStack.classList.remove('final');
 const d=DATA[state.index];const page=document.createElement('article');page.className=`page entry-${state.index}`;
 page.innerHTML=`<div class="pageTop"><div class="docmeta">Documento 0${state.index+1} · archivo privado</div><div class="scriptP">P</div></div><div class="chapterNo">Capítulo 0${state.index+1}</div><h2 class="title">${d.title}</h2><p class="lead">${d.lead}</p><div class="clue"><p>${d.clue}</p></div><div class="metaRow"><div class="timeMeta">Referencia temporal<b id="timeState">Todavía puedes resolver la ficha.</b></div><div id="timer" class="timer">01:30</div></div><div class="prompt">Pregunta del expediente</div><div class="answer"><input id="answerInput" type="text" autocomplete="off" autocapitalize="sentences" aria-label="Respuesta"><button id="answerBtn" type="button">Confirmar</button></div><div class="hintWrap"><button id="hintBtn" class="hintBtn" type="button"><span>¿Necesitas una pista? · Mostrar pista</span><em>▾</em></button><div id="hintPanel" class="hintPanel"><div class="hintInner"><div class="hintCard"><span class="hintTitle">Pista opcional</span><p>${d.hint}</p></div></div></div></div>`;
 pageHost.innerHTML='';pageHost.appendChild(page);
 const start=Date.now(),timer=page.querySelector('#timer'),ts=page.querySelector('#timeState');const tick=()=>{const elapsed=Math.floor((Date.now()-start)/1000),left=Math.max(0,90-elapsed);timer.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;ts.textContent=left>0?'Todavía puedes resolver la ficha.':'00:00 · puedes seguir.'};tick();const int=setInterval(tick,1000);
 const hb=page.querySelector('#hintBtn'),hp=page.querySelector('#hintPanel');hb.addEventListener('click',()=>{hb.classList.toggle('open');hp.classList.toggle('open')});
 const ai=page.querySelector('#answerInput'),ab=page.querySelector('#answerBtn');
 function check(){const v=norm(ai.value);if(d.answers.map(norm).includes(v)){clearInterval(int);ai.disabled=true;ab.disabled=true;if(!state.solved[state.index]){state.solved[state.index]=true;state.notes.push(d.fragment);save();renderNotes();renderTabs();}launchTransition(state.index,d.fragment);}else{ai.style.borderColor='#9f4052';ai.style.boxShadow='0 0 0 2px rgba(159,64,82,.08)';setTimeout(()=>{ai.style.borderColor='';ai.style.boxShadow='';},650)}}
 ab.addEventListener('click',check);ai.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});ai.focus();
}
function transitionMarkup(i,fragment){
 const nextLabel=i===4?'Reconstruir la carta':'Abrir siguiente documento';
 if(i===0)return `<div class="stampPaper"><div class="stampWord">Archivado</div><div class="tContent"><div class="evidenceKicker">Evidencia recuperada · 01</div><h2 class="evidenceText">${fragment}</h2><p class="evidenceSub">La primera nota queda incorporada al expediente.</p><button class="overlayBtn" data-next>${nextLabel}</button></div></div>`;
 if(i===1)return `<div class="drawerWall"></div><div class="drawerLabel">Cajón de archivo · sección 02</div><div class="fileCard"><div class="evidenceKicker">Ficha recuperada</div><h2 class="evidenceText">${fragment}</h2><p class="evidenceSub">La segunda ficha ha sido archivada.</p><button class="overlayBtn" data-next>${nextLabel}</button></div>`;
 if(i===2)return `<div class="coverL"></div><div class="coverR"></div><div class="spine"></div><div class="centerCard"><div><div class="evidenceKicker">Documento central confirmado</div><h2 class="evidenceText">${fragment}</h2><p class="evidenceSub">La pieza principal ya está identificada.</p><button class="overlayBtn" data-next>${nextLabel}</button></div></div>`;
 if(i===3)return `<div class="typeSheet"><div class="typeLabel">Transcripción · documento 04</div><div class="typeLine"></div><div class="typeEvidence" id="typedText"></div><p class="evidenceSub">La cuarta nota queda incorporada al expediente.</p><button class="overlayBtn" data-next>${nextLabel}</button></div>`;
 return `<div class="dossierCover"><div><div class="seal">P</div><div class="evidenceKicker">Última evidencia confirmada</div><h2 class="evidenceText">${fragment}</h2><p class="evidenceSub">Las cinco piezas del expediente están completas.</p><button class="overlayBtn" data-next>${nextLabel}</button></div></div>`;
}
function launchTransition(i,fragment){
 transition.className=`transition t${i} show`;
 transition.innerHTML=transitionMarkup(i,fragment);
 transition.dataset.step=String(i);
 transition.dataset.busy='0';
 transition.setAttribute('aria-hidden','false');
 if(i===3){
   const el=transition.querySelector('#typedText');let pos=0;const text=fragment;
   const timer=setInterval(()=>{
     if(!el||!document.body.contains(el)){clearInterval(timer);return;}
     el.innerHTML=text.slice(0,pos+1)+'<span class="cursor"></span>';
     pos++;if(pos>=text.length)clearInterval(timer);
   },32);
 }
}
function advanceTransition(i){
 if(transition.dataset.busy==='1')return;
 transition.dataset.busy='1';
 const btn=transition.querySelector('[data-next]');
 if(btn){btn.disabled=true;btn.style.pointerEvents='none';}
 // Prepare the next page/menu immediately behind the full-screen transition.
 // This removes the blank pause users could perceive after pressing continue.
 state.index=i+1;save();window.scrollTo({top:0,behavior:'instant'});render();
 requestAnimationFrame(()=>requestAnimationFrame(()=>transition.classList.add('closing')));
 const delays=[430,500,460,480,560];
 setTimeout(()=>{
   transition.className='transition';
   transition.innerHTML='';
   transition.removeAttribute('data-step');
   transition.removeAttribute('data-busy');
   transition.setAttribute('aria-hidden','true');
 },delays[i]||480);
}
transition.addEventListener('click',e=>{
 const btn=e.target.closest('[data-next]');
 if(!btn)return;
 e.preventDefault();e.stopPropagation();
 const i=Number(transition.dataset.step);
 if(Number.isFinite(i))advanceTransition(i);
});
function renderMenu(){
 pageHost.innerHTML='';paperStack.classList.add('final');document.querySelector('.paperBack1').style.display='none';document.querySelector('.paperBack2').style.display='none';tabs.innerHTML=DATA.map((d,i)=>`<div class="tab done"><div class="tabNum">0${i+1}</div></div>`).join('');
 menuHost.innerHTML=`<div class="menuWrap"><div class="menu active"><div class="menuHead"><div class="menuSeal">P</div><h2 class="menuTitle"><span class="script">Expediente</span>Pituflillos</h2><div class="menuMeta">Expediente reconstruido · 02.10.26</div></div><p class="menuIntro">Cinco notas eran suficientes. El resto pertenecía a la mesa.</p>${MENU.map(c=>`<div class="course"><small>${c[0]}</small><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('')}<div class="closing">Expediente resuelto. Todo está dispuesto.</div></div></div>`;
}
function resetExperience(){
 try{localStorage.removeItem('pituflillos_dossier_v1');}catch(e){}
 state={index:0,solved:[],notes:[]};
 transition.className='transition';transition.innerHTML='';transition.removeAttribute('data-step');transition.removeAttribute('data-busy');transition.setAttribute('aria-hidden','true');
 drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');
 opening.classList.remove('show');
 caseScreen.classList.remove('active');intro.classList.add('active');
 feedback.textContent='';otp.forEach(x=>x.value='');
 pageHost.innerHTML='';menuHost.innerHTML='';tabs.innerHTML='';notesList.innerHTML='';
 paperStack.classList.remove('final');
 const b1=document.querySelector('.paperBack1'),b2=document.querySelector('.paperBack2');if(b1)b1.style.display='';if(b2)b2.style.display='';
 window.scrollTo({top:0,behavior:'instant'});
 setTimeout(()=>{if(otp[0])otp[0].focus();},60);
}
resetBtn.addEventListener('click',()=>{if(confirm('¿Reiniciar el expediente desde el principio?'))resetExperience();});
archiveBtn.addEventListener('click',()=>{drawer.classList.add('open');drawer.setAttribute('aria-hidden','false')});closeDrawer.addEventListener('click',()=>{drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')});drawer.addEventListener('click',e=>{if(e.target===drawer){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')}});
load();
})();
</script>
